# GLPI help desk (ITSM) lab: official images, pinned versions.
# Bound to 127.0.0.1 only, so the lab is not reachable from other devices on your network.
name: helpdesk-lab

services:
  glpi:
    image: "glpi/glpi:11.0.11"
    restart: "unless-stopped"
    volumes:
      - glpi_data:/var/glpi
    env_file: .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8090:80"

  db:
    image: "mysql:8.4"
    restart: "unless-stopped"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}

volumes:
  glpi_data:
  db_data:
